<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शहर ट्रैफिक कमांड सेंटर (Prototype)</title>
<style>
  body{background:#0b132b;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;margin:0;padding:16px}
  h1{color:#22d3ee;font-size:20px;margin:0 0 6px}
  input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px;width:100%;box-sizing:border-box;margin-top:8px}
  button{background:#0891b2;font-weight:bold;cursor:pointer}
  .card{background:#111c33;border:1px solid #1e3a5f;border-radius:10px;padding:12px;margin-top:10px}
  .amb{color:#f87171;font-weight:bold}
  .muted{color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<h1>🎓 शहर ट्रैफिक कमांड सेंटर (Prototype)</h1>
<p class="muted">शहर का नाम लिखें और "खोजें" दबाएँ। चौराहे और जगहें OpenStreetMap से आएँगी। गाड़ियाँ और signal समय simulation हैं।</p>

<input id="city" value="Chandigarh" placeholder="शहर का नाम लिखें">
<button id="go">खोजें</button>
<div id="status" class="muted"></div>
<div id="out"></div>

<script>
const st = document.getElementById('status');
const out = document.getElementById('out');

function seeded(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function geocode(name){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q=' + encodeURIComponent(name);
  const r = await fetch(url);
  const d = await r.json();
  if(!d.length) throw new Error('शहर नहीं मिला');
  return d[0];
}

async function findPlaces(bbox){
  const [s,n,w,e] = bbox;
  const q = `[out:json][timeout:25];(
    node["highway"="traffic_signals"](${s},${w},${n},${e});
    node["amenity"~"hospital|bus_station|college|university"]["name"](${s},${w},${n},${e});
    node["place"~"suburb|neighbourhood|village"]["name"](${s},${w},${n},${e});
  );out 80;`;
  const r = await fetch('https://overpass-api.de/api/interpreter', {
    method:'POST',
    body:'data=' + encodeURIComponent(q)
  });
  const d = await r.json();
  return d.elements.filter(x => x.tags && x.tags.name);
}

function render(places){
  out.innerHTML = '';
  const rows = places.map(p => {
    const h = seeded(p.tags.name + p.id);
    const veh = h % 180 + 20;                 // simulation
    const amb = h % 9 === 0;                  // simulation
    const green = Math.min(90, 25 + Math.round(veh/3));
    const red = 120 - green;
    const crowd = veh>120 ? 'ज़्यादा' : veh>70 ? 'मध्यम' : 'कम';
    return {name:p.tags.name, type:p.tags.amenity || p.tags.highway || p.tags.place, veh, crowd, green, red, amb};
  }).sort((a,b)=>b.veh-a.veh);

  for(const r of rows){
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      `<b>${esc(r.name)}</b> <span class="muted">(${esc(r.type)})</span><br>` +
      `गाड़ियाँ (सिम्युलेशन): ${r.veh} | भीड़: ${r.crowd}<br>` +
      `ग्रीन: ${r.green} सेकंड | लाल: ${r.red} सेकंड` +
      (r.amb ? `<br><span class="amb">🚑 एम्बुलेंस फँसी (सिम्युलेशन)</span>` : '');
    out.appendChild(div);
  }
}

document.getElementById('go').onclick = async () => {
  const city = document.getElementById('city').value.trim();
  if(!city) return;
  out.innerHTML = '';
  st.textContent = 'शहर ढूँढ रहे हैं...';
  try{
    const g = await geocode(city);
    st.textContent = g.display_name + ' — जगहें ढूँढ रहे हैं (कुछ सेकंड लग सकते हैं)...';
    const places = await findPlaces(g.boundingbox);
    st.textContent = `${g.display_name} — ${places.length} जगहें मिलीं`;
    render(places);
  }catch(err){
    st.textContent = 'गलती: ' + err.message + '. एक बार फिर "खोजें" दबाएँ।';
  }
};
</script>
</body>
</html>
