<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शहर ट्रैफिक कमांड सेंटर (Prototype)</title>
<style>
  body{background:#0b132b;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;margin:0;padding:16px}
  h1{color:#22d3ee;font-size:20px;margin:0 0 6px}
  input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px;width:100%;box-sizing:border-box;margin-top:8px}
  button{background:#0891b2;font-weight:bold;cursor:pointer}
  .card{background:#111c33;border:1px solid #1e3a5f;border-radius:10px;padding:12px;margin-top:10px;line-height:1.7}
  .amb{color:#f87171;font-weight:bold}
  .muted{color:#94a3b8;font-size:13px}
  .err{color:#fca5a5;font-size:14px;margin-top:8px;word-break:break-word}
</style>
</head>
<body>
<h1>🎓 शहर ट्रैफिक कमांड सेंटर (Prototype)</h1>
<p class="muted">शहर का नाम लिखें, जैसे "Chandigarh" या "Chandigarh Sector 17"। जगहों के नाम OpenStreetMap से आते हैं। गाड़ियों की गिनती और एम्बुलेंस simulation हैं। बत्ती का समय असली घड़ी से चलता है।</p>

<input id="city" value="Chandigarh" placeholder="जैसे: Chandigarh Sector 17">
<button id="go">खोजें</button>
<div id="status" class="muted"></div>
<div id="out"></div>

<script>
const st = document.getElementById('status');
const out = document.getElementById('out');
const MIRRORS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
let lastEls = null;

function seeded(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildQuery(city){
  return `[out:json][timeout:90];
area["name"="${city}"]->.a;
(
  nwr(area.a)["name"~"Sector|Chowk|Mall|Hospital|PGI|Plaza|Market|ISBT|Airport|Stadium|University|College|Bus|Railway|Junction",i];
  nwr(area.a)["highway"="traffic_signals"]["name"];
  nwr(area.a)["shop"="mall"]["name"];
  nwr(area.a)["amenity"~"hospital|bus_station|college|university"]["name"];
  nwr(area.a)["place"~"suburb|neighbourhood|quarter"]["name"];
);
out center 800;`;
}

async function askOverpass(query){
  let lastErr = '';
  for(const url of MIRRORS){
    try{
      const r = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'data=' + encodeURIComponent(query)
      });
      const text = await r.text();
      if(!r.ok){ lastErr = `सर्वर ${r.status}`; continue; }
      try{ return JSON.parse(text); }
      catch(e){ lastErr = 'सर्वर ने व्यस्त जवाब भेजा'; continue; }
    }catch(e){
      lastErr = 'नेटवर्क समस्या: ' + e.message;
    }
  }
  throw new Error(lastErr + '. 30 सेकंड बाद फिर "खोजें" दबाएँ।');
}

function render(elements){
  lastEls = elements;
  out.innerHTML = '';
  const nowSec = Math.floor(Date.now()/1000);
  const rows = elements.map(p => {
    const name = p.tags.name;
    const h = seeded(name + p.id);
    const veh = h % 180 + 20;                  // सिम्युलेशन: असली गिनती नहीं
    const green = Math.min(90, 25 + Math.round(veh/3));
    const yellow = 3;
    const red = Math.max(40, 120 - green);
    const cycle = green + yellow + red;
    const pos = nowSec % cycle;                // चक्र में अभी की जगह (असली घड़ी)
    let phase, left;
    if (pos < green)                 { phase = 'हरी';  left = green - pos; }
    else if (pos < green + yellow)   { phase = 'पीली'; left = green + yellow - pos; }
    else                             { phase = 'लाल';  left = cycle - pos; }
    const amb = h % 9 === 0;                   // सिम्युलेशन
    const eta = 20 + (h % 60);                 // एम्बुलेंस कितने सेकंड में पहुँचेगी
    const queue = Math.round(veh * 0.4);       // रुकी गाड़ियाँ (मॉडल)
    const clear = Math.ceil(queue * 2);        // लगभग 2 सेकंड प्रति गाड़ी
    const type = p.tags.amenity || p.tags.shop || p.tags.highway || p.tags.place || '';
    return {name, type, veh, green, red, phase, left, amb, eta, clear,
            lat: p.lat ?? p.center?.lat, lon: p.lon ?? p.center?.lon};
  }).sort((a,b)=>b.veh-a.veh);

  for(const r of rows){
    const div = document.createElement('div');
    div.className = 'card';
    const color = r.phase==='लाल' ? '#f87171' : r.phase==='हरी' ? '#4ade80' : '#facc15';
    let html =
      `<b>${esc(r.name)}</b> <span class="muted">(${esc(r.type)})</span><br>` +
      (r.lat ? `<span class="muted">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</span><br>` : '') +
      `<span style="color:${color};font-weight:bold">अभी: ${r.phase} बत्ती, ${r.left} सेकंड बाकी</span><br>` +
      `हरी ${r.green} सेकंड | पीली 3 सेकंड | लाल ${r.red} सेकंड<br>` +
      `<span class="muted">गाड़ियाँ (सिम्युलेशन, असली गिनती नहीं): ${r.veh}</span>`;
    if(r.amb){
      html += `<br><span class="amb">🚑 एम्बुलेंस (सिम्युलेशन) ~${r.eta} सेकंड में पहुँचेगी। ` +
              `सिग्नल हरा रखें। रुकी गाड़ियाँ लगभग ${r.clear} सेकंड में निकलेंगी।</span>`;
    }
    div.innerHTML = html;
    out.appendChild(div);
  }
}

// हर सेकंड बत्ती का समय अपडेट होगा
setInterval(() => { if(lastEls && lastEls.length) render(lastEls); }, 1000);

document.getElementById('go').onclick = async () => {
  const typed = document.getElementById('city').value.trim();
  if(!typed) return;
  const city = typed.split(/\s+/)[0];
  const filter = typed.slice(city.length).trim().toLowerCase();
  out.innerHTML = '';
  lastEls = null;
  st.textContent = 'जगहें ढूँढ रहे हैं (20-60 सेकंड लग सकते हैं)...';
  try{
    const data = await askOverpass(buildQuery(city));
    let els = (data.elements || []).filter(x => x.tags && x.tags.name);
    if(filter) els = els.filter(x => x.tags.name.toLowerCase().includes(filter));
    if(!els.length){
      st.textContent = `"${typed}" के लिए कोई जगह नहीं मिली। शहर का नाम सही है? OpenStreetMap में नाम अंग्रेज़ी में होता है।`;
      return;
    }
    st.textContent = `${typed}: ${els.length} जगहें मिलीं (OpenStreetMap से)`;
    render(els);
  }catch(err){
    st.innerHTML = '<span class="err">गलती: ' + esc(err.message) + '</span>';
  }
};
</script>
</body>
</html>
