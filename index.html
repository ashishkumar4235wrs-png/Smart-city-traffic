<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashish Kumar · Traffic Command Center</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 15% 0%,#1e3a8a,#0b132b 60%) fixed;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 20px;background:rgba(15,23,42,.9);border-bottom:1px solid #22d3ee55;box-shadow:0 0 22px #0ea5e944;position:sticky;top:0;z-index:50}
  .brand h2{margin:0;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,#67e8f9,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}
  .brand small{color:#94a3b8;font-size:12px;letter-spacing:2px;text-transform:uppercase}
  nav a{color:#cbd5e1;text-decoration:none;margin-left:6px;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:14px}
  nav a.active,nav a:hover{background:linear-gradient(90deg,#0891b2,#22d3ee);color:#fff;box-shadow:0 0 12px #22d3ee}
  select{background:#0f172a;color:#fff;border:1px solid #22d3ee;border-radius:8px;padding:6px}
  .auth{max-width:380px;margin:50px auto;background:rgba(17,28,51,.92);border:1px solid #22d3ee;border-radius:18px;padding:26px;box-shadow:0 0 34px #0891b2}
  .auth h2{text-align:center;margin:0 0 6px;background:linear-gradient(90deg,#67e8f9,#f472b6);-webkit-background-clip:text;color:transparent}
  .auth input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}
  .muted{color:#94a3b8;font-size:14px}
  .btn{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(90deg,#0891b2,#22d3ee,#a78bfa);color:#fff;font-weight:bold;cursor:pointer;font-size:16px;box-shadow:0 0 16px #22d3ee88}
  .page{display:none;padding:22px;max-width:1150px;margin:auto}
  .page.show{display:block}
  h1{background:linear-gradient(90deg,#67e8f9,#a78bfa);-webkit-background-clip:text;color:transparent;font-size:26px;margin:8px 0}
  .searchbox{display:flex;gap:8px;margin:18px 0}
  .searchbox input{flex:1;padding:14px;border-radius:14px;border:1px solid #22d3ee;background:#0f172a;color:#fff;font-size:17px}
  .searchbox button{width:auto;padding:14px 24px}
  .chips span{display:inline-block;background:#111c33;border:1px solid #22d3ee;padding:6px 12px;border-radius:20px;margin:4px;cursor:pointer;font-size:13px}
  .chips span:hover{box-shadow:0 0 10px #22d3ee}
  .tips{background:rgba(17,28,51,.9);border:1px solid #1e3a5f;border-radius:12px;padding:12px;font-size:14px;line-height:1.8;margin:12px 0}
  .note{background:rgba(30,41,59,.9);border-left:4px solid #facc15;padding:10px;border-radius:8px;font-size:13px;margin:12px 0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
  .stat{background:rgba(17,28,51,.9);border:1px solid #22d3ee;border-radius:14px;padding:14px;box-shadow:0 0 14px #0891b244}
  .stat b{display:block;font-size:24px;color:#67e8f9}
  #loader{position:relative;height:150px;border-radius:14px;border:1px solid #22d3ee;background:#0b132b;overflow:hidden;margin:12px 0;display:none}
  #loader .road{position:absolute;left:0;right:0;top:50%;height:4px;background:#334155}
  #loader .car{position:absolute;width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:drive 6s linear infinite}
  #loader .car.r{background:#f87171;box-shadow:0 0 8px #f87171;animation-duration:9s;top:30%}
  #loader .car.y{background:#facc15;box-shadow:0 0 8px #facc15;animation-duration:7s;top:65%}
  @keyframes drive{from{left:-5%}to{left:105%}}
  #loader .sig{position:absolute;top:18px;right:18px;width:14px;height:14px;border-radius:50%;animation:blink 3s steps(1) infinite}
  @keyframes blink{0%{background:#4ade80}50%{background:#f87171}}
  #loader p{position:absolute;bottom:10px;left:14px;margin:0;font-size:13px;color:#94a3b8}
  #map{height:380px;border-radius:14px;border:1px solid #22d3ee;margin:12px 0;box-shadow:0 0 25px #0891b255}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:12px}
  .card{background:rgba(17,28,51,.9);border:1px solid #1e3a5f;border-radius:14px;padding:14px;line-height:1.7;transition:.2s}
  .card:hover{border-color:#22d3ee;box-shadow:0 0 16px #0891b266}
  .dot2{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .vt{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px;font-size:14px}
  .amb{color:#f87171;font-weight:bold}
  .err{color:#fca5a5}
  footer{text-align:center;color:#64748b;font-size:13px;padding:20px}
</style>

};
let curLang='hi', lastEls=[], map=null, markers=[], fitNext=true;
const MIRRORS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const BASE='Sector|Chowk|Mall|Hospital|PGI|Plaza|Market|ISBT|Airport|Stadium|University|College|Bus|Railway|Junction|Park|Garden|Lake|Phase|Rock|Sukhna|Leisure|Rose|Elante|Piccadily|Tribune|Transport|Zakir';
function t(k){return (T[curLang]&&T[curLang][k])||T.hi[k]||k;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clean(s){return String(s).replace(/[^\p{L}\p{N} ]/gu,'').trim();}
function applyLang(){
  document.documentElement.lang=curLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.getElementById('tag').textContent=t('tag');
  document.getElementById('go').textContent=t('search');
  document.getElementById('lang').value=curLang;
  document.getElementById('loaderText').textContent=t('loaderText');
  renderAll();
}
document.getElementById('lang').onchange=e=>{curLang=e.target.value;applyLang();};
document.getElementById('loginBtn').onclick=()=>{
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  applyLang();
};
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.getElementById(a.dataset.page).classList.add('show');
  if(map) setTimeout(()=>map.invalidateSize(),100);
  renderAll();
});
document.querySelectorAll('.chips span').forEach(s=>s.onclick=()=>{
  document.getElementById('city').value=s.dataset.q;
  document.getElementById('go').click();
});
function buildQuery(area,pattern){
  return `[out:json][timeout:60];
area["name"="${area}"]->.a;
(
  nwr(area.a)["name"~"${pattern}",i];
  nwr(area.a)["highway"="traffic_signals"]["name"];
  nwr(area.a)["shop"="mall"]["name"];
  nwr(area.a)["amenity"~"hospital|bus_station|college|university"]["name"];
);
out center 800;`;
}
async function askOverpass(query){
  let lastErr='';
  for(const url of MIRRORS){
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(query)});
      const text=await r.text();
      if(!r.ok){lastErr='Server '+r.status;continue;}
      try{return JSON.parse(text);}catch(e){lastErr='Busy response';}
    }catch(e){lastErr='Network: '+e.message;}
  }
  throw new Error(lastErr+' — 30 सेकंड बाद फिर दबाएँ');
}
// एक area में खोज; अगर गलती हो तो खाली लौटाता है
async function tryArea(area,pattern){
  try{
    const d=await askOverpass(buildQuery(area,pattern));
    return (d.elements||[]).filter(x=>x.tags&&x.tags.name);
  }catch(e){ return null; }
}
async function searchAll(typed){
  const parts=typed.trim().split(/\s+/);
  const area=clean(parts[0]);
  const extra=clean(parts.slice(1).join(' '));
  const candidates=[];
  if(extra){
    candidates.push([area, extra]);
    if(/mohali/i.test(extra)) candidates.push(['Mohali', BASE]);
    if(/panchkula/i.test(extra)) candidates.push(['Panchkula', BASE]);
    candidates.push([area, BASE]);
  } else {
    candidates.push([area, BASE]);
  }
  const map2=new Map();
  let anyOk=false;
  for(const [a,p] of candidates){
    const res=await tryArea(a,p);
    if(res===null) continue;
    anyOk=true;
    res.forEach(x=>map2.set(x.id,x));
    if(map2.size>=5) break;
  }
  if(!anyOk) throw new Error('सर्वर व्यस्त है');
  return [...map2.values()];
}
// हर जगह के लिए अनुमानित डेटा
function seeded(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function split(total){
  const bus=Math.max(0,Math.round(total*0.10));
  const truck=Math.max(0,Math.round(total*0.06));
  const auto=Math.max(0,Math.round(total*0.22));
  const bike=Math.max(0,Math.round(total*0.35));
  const car=Math.max(0,total-bus-truck-auto-bike);
  return {car,bus,truck,auto,bike};
}
function info(p){
  const name=p.tags.name;
  const h=seeded(name+p.id);
  const slot=Math.floor(Date.now()/10000);
  const veh=15+((h+slot*37)%46);
  const green=Math.min(90,25+Math.round(veh/2));
  const yellow=3, red=Math.max(40,120-green);
  const cycle=green+yellow+red;
  const pos=Math.floor(Date.now()/1000)%cycle;
  let phase,left;
  if(pos<green){phase='G';left=green-pos;}
  else if(pos<green+yellow){phase='Y';left=green+yellow-pos;}
  else{phase='R';left=cycle-pos;}
  const type=p.tags.amenity||p.tags.shop||p.tags.highway||p.tags.place||'';
  return {name,type,veh,green,red,phase,left,amb:h%9===0,eta:20+(h%60),
          clear:Math.ceil(Math.round(veh*0.4)*2),split:split(veh),
          lat:p.lat??p.center?.lat,lon:p.lon??p.center?.lon};
}
function phaseName(p){return p==='G'?t('green'):p==='Y'?t('yellow'):t('red');}
function dotColor(p){return p==='R'?'#f87171':p==='G'?'#4ade80':'#facc15';}
function card(r){
  const c=dotColor(r.phase), s=r.split;
  return `<div class="card">
    <b>${esc(r.name)}</b> <span class="muted">(${esc(r.type)})</span><br>
    <span style="color:${c};font-weight:bold"><span class="dot2" style="background:${c}"></span>${t('now')}: ${phaseName(r.phase)}, ${r.left} ${t('sec')} ${t('left')}</span><br>
    ${t('green')} ${r.green}s | ${t('yellow')} 3s | ${t('red')} ${r.red}s
    <div class="vt">
      <span>${t('car')}: ${s.car}</span><span>${t('bus')}: ${s.bus}</span>
      <span>${t('truck')}: ${s.truck}</span><span>${t('auto')}: ${s.auto}</span>
      <span>${t('bike')}: ${s.bike}</span>
    </div>
    <span class="muted" style="font-size:12px">${t('est')}</span>
    ${r.amb?`<br><span class="amb">🚑 ${r.eta}s | ${r.clear}s</span>`:''}
  </div>`;
}
function drawMap(rows){
  if(!map){
    map=L.map('map').setView([30.7333,76.7794],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  }
  markers.forEach(m=>m.remove()); markers=[];
  rows.forEach(r=>{
    if(!r.lat) return;
    markers.push(L.marker([r.lat,r.lon]).addTo(map).bindPopup(`<b>${esc(r.name)}</b><br>${phaseName(r.phase)}, ${r.left}s`));
  });
  if(fitNext && markers.length){
    map.fitBounds(L.featureGroup(markers).getBounds().pad(0.1));
    fitNext=false;
  }
  setTimeout(()=>map.invalidateSize(),100);
}
function renderStats(rows){
  const avgV=rows.length?Math.round(rows.reduce((a,r)=>a+r.veh,0)/rows.length):0;
  const avgG=rows.length?Math.round(rows.reduce((a,r)=>a+r.green,0)/rows.length):0;
  const amb=rows.filter(r=>r.amb).length;
  document.getElementById('stats').innerHTML=
    `<div class="stat">${t('sJunc')}<b>${rows.length}</b></div>
     <div class="stat">${t('sAvg')}<b>${avgV}</b></div>
     <div class="stat">${t('sAmb')}<b>${amb}</b></div>
     <div class="stat">${t('sGreen')}<b>${avgG}s</b></div>`;
}
// सिर्फ कार्ड और बत्ती अपडेट; नक्शा नहीं बदलता
function renderAll(){
  if(!lastEls.length) return;
  const rows=lastEls.map(info).sort((a,b)=>b.veh-a.veh);
  document.getElementById('out').innerHTML=rows.map(card).join('');
  renderStats(rows);
  const chowk=rows.filter(r=>r.type==='traffic_signals'||r.type==='junction'||r.type==='');
  const hosp=rows.filter(r=>r.type==='hospital');
  const amb=rows.filter(r=>r.amb||r.type==='hospital');
  document.getElementById('chowkOut').innerHTML=chowk.map(card).join('')||`<p class="muted">${t('none')}</p>`;
  document.getElementById('hospOut').innerHTML=hosp.map(card).join('')||`<p class="muted">${t('none')}</p>`;
  document.getElementById('ambOut').innerHTML=amb.map(card).join('')||`<p class="muted">${t('none')}</p>`;
  if(document.getElementById('home').classList.contains('show')) drawMap(rows);
}
document.getElementById('go').onclick=async()=>{
  const typed=document.getElementById('city').value.trim();
  if(!typed) return;
  const st=document.getElementById('status'), loader=document.getElementById('loader');
  document.getElementById('out').innerHTML='';
  st.textContent=t('loading');
  loader.style.display='block';
  try{
    const els=await searchAll(typed);
    loader.style.display='none';
    if(!els.length){ st.textContent=`"${typed}" — ${t('notFound')}`; return; }
    lastEls=els;
    fitNext=true;
    st.textContent=`${typed}: ${els.length} ${t('found')}`;
    renderAll();
  }catch(err){
    loader.style.display='none';
    st.innerHTML='<span class="err">'+esc(err.message)+'</span>';
  }
};
// हर सेकंड सिर्फ कार्ड और बत्ती का समय (नक्शा नहीं)
setInterval(()=>{ if(lastEls.length) renderAll(); },1000);
applyLang();
</script>
</body>
